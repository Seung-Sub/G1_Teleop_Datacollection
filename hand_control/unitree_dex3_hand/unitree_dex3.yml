# Unitree DEX3 양손 retargeting config (DexPilot)
#
# NOTE: xr_teleoperate 원본 yml 은 dex_retargeting 의 신버전을 가정해
# `target_link_human_indices_dexpilot` / `target_link_human_indices_vector`
# / `target_origin_link_names` / `target_task_link_names` 같은 vector-type
# 전용 키들을 함께 노출한다. 우리 hand_control/dex_retargeting fork 는
# `target_link_human_indices` 단일 키만 받는 구버전이므로 이 파일은 우리
# fork 가 받을 수 있는 형태로 축약했다. xr_teleoperate 의 dexpilot 값을
# `target_link_human_indices` 로 그대로 가져왔다. (left/right 동일)

left:
  type: DexPilot
  urdf_path: unitree_dex3_hand/unitree_dex3_left.urdf

  target_joint_names:
    [
      "left_hand_thumb_0_joint",
      "left_hand_thumb_1_joint",
      "left_hand_thumb_2_joint",
      "left_hand_middle_0_joint",
      "left_hand_middle_1_joint",
      "left_hand_index_0_joint",
      "left_hand_index_1_joint",
    ]

  wrist_link_name: "base_link"
  finger_tip_link_names: ["thumb_tip", "index_tip", "middle_tip"]
  target_link_human_indices: [[9, 14, 14, 0, 0, 0], [4, 4, 9, 4, 9, 14]]

  scaling_factor: 1.0
  low_pass_alpha: 0.2

right:
  type: DexPilot
  urdf_path: unitree_dex3_hand/unitree_dex3_right.urdf

  target_joint_names:
    [
      "right_hand_thumb_0_joint",
      "right_hand_thumb_1_joint",
      "right_hand_thumb_2_joint",
      "right_hand_index_0_joint",
      "right_hand_index_1_joint",
      "right_hand_middle_0_joint",
      "right_hand_middle_1_joint",
    ]

  wrist_link_name: "base_link"
  finger_tip_link_names: ["thumb_tip", "index_tip", "middle_tip"]
  target_link_human_indices: [[9, 14, 14, 0, 0, 0], [4, 4, 9, 4, 9, 14]]

  scaling_factor: 1.0
  low_pass_alpha: 0.2
