right:
  type: vector
  urdf_path: kistar_v2_hand/kistar_v2.urdf
  wrist_link_name: "right_mount"

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: ['right_thumb_joint_0', 'right_thumb_joint_1','right_thumb_joint_2','right_thumb_joint_3',
                       'right_index_joint_0', 'right_index_joint_1','right_index_joint_2','right_index_joint_3',
                       'right_middle_joint_0', 'right_middle_joint_1','right_middle_joint_2','right_middle_joint_3',
                       'right_ring_joint_0', 'right_ring_joint_1','right_ring_joint_2','right_ring_joint_3',
                       ]
  target_origin_link_names: [ "right_mount", "right_mount", "right_mount", "right_mount"]
  target_task_link_names: [ "right_thumb_tip", "right_index_tip", "right_middle_tip", "right_ring_tip"]
  scaling_factor: 1.20

  # Source refers to the retargeting input, which usually corresponds to the human hand
  # The joint indices of human hand joint which corresponds to each link in the target_link_names
  target_link_human_indices: [ [ 0, 0, 0, 0, 0 ], [ 4, 9, 14, 19 ] ]

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.2