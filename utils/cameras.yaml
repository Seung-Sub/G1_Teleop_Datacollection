# Camera role ↔ serial 매핑 (multi-view 확장용 stub).
# 현재 단일 카메라(ego)만 사용. 멀티 카메라 도입 시 아래에 역할별 serial 추가.
#
# 예시:
# cameras:
#   - role: ego
#     type: realsense
#     serial: "123456789012"
#     resolution: [640, 480]
#     fps: 30
#   - role: wrist_l
#     type: realsense
#     serial: "987654321098"
#     resolution: [640, 480]
#     fps: 30
#   - role: wrist_r
#     type: realsense
#     serial: "111222333444"
#
# main.py 는 현재 이 yaml 을 참조하지 않는다 — `--camera <serial> --camera-role ego`
# 같은 CLI 인자만 사용. 추후 yaml-driven multi-camera 도입 시 main.py 의
# resolve_camera 함수에서 cameras.yaml 을 로드하도록 확장.

cameras: []
