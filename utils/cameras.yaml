# Phase K7-A (P0-3): Camera role ↔ serial 매핑.
#
# 단일/멀티 카메라 모두 동일 schema. 단일 운용 시 ego 1개만 두면 됨.
#
# role: ego / wrist_l / wrist_r — modality.json 의 video 키 이름과 일치.
#       (utils/parquet/modality_{inspire,dex3}.json 의 video.{ego,wrist_l,wrist_r})
# type: realsense | zed
# serial: 비워두거나 "auto" 면 type 의 첫 device 자동선택.
#
# 본 파일이 비어 있고 main.py --cameras-config 가 지정되지 않으면 main.py 는
# `--camera <serial|auto|none>` 단일 카메라 모드로 동작 (ego 슬롯 1개).
#
# -----------------------------------------------------------------------------
# 2026-05-22 D405 교체 후 현재 검출 RealSense:
#   D455 serial=046322250265  fw=5.17.0.10  → ego (정면, 변경 없음)
#   D405 serial=128422272260  fw=5.15.1     → wrist_l (새 device, 사용자 left/right 임의 매핑)
#   (D405 두 번째 — 아직 USB 미연결 / wrist_r 두 번째 D405 연결되면 아래 wrist_r 블록 주석 해제 + serial 갱신)
#
# 이전 (구) serial 기록 (재연결 시 참고):
#   D405 335122272533 (구 wrist_l, fw 5.15.0.2)
#   D405 409122272167 (구 wrist_r, fw 5.15.1.55)
# -----------------------------------------------------------------------------

cameras:
  - role: ego
    type: realsense
    serial: "046322250265"   # D455 — 작업공간 정면 시점 (정책 주 시점)
  - role: wrist_l
    type: realsense
    serial: "260322273344"   # D405 — 새 device (2026-06-12 교체).
    # D405 AE 는 60fps 에서 gain 을 floor(16) 고정+노출 상한이라 손목뷰가 어두움(mean39, crushed). manual 고정.
    # VLA(GR00T N1.7: 256 다운스케일 + Cosmos-Reason2 백본 + 학습 ColorJitter → 절대밝기 비민감) 기준 최적화:
    # ①60fps 최우선(exp<~12000μs; exp16000=fps반토막) ②블러 억제(짧은 노출, 다운스케일로 복구불가)
    # ③노이즈는 256 다운스케일이 완화(게인 부담↓) ④crushed black 회피(디테일 보존) ⑤고정노출=프레임간 일관성.
    # 검증: exp8000/gain96 → 60fps, 저장 wrist mean~90(이전 39), crushed 16%(이전 54%). (조명 따라 튜닝)
    exposure: 8000
    gain: 96
  - role: wrist_r
    type: realsense
    serial: "260322270668"   # D405 — 새 device (2026-06-12 교체).
    exposure: 8000
    gain: 96

